<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>	
	<script>
		function secondHighest(arr) {
			//Write your code here
			let mx=Number.MIN_VALUE;
			 let ans=mx;
			 arr.forEach((item)=>{
			   if(item>mx){
			     mx=item;
			   }
			 })
			 
			 arr.forEach((item)=>{
			   if(item>ans && item!==mx){
			     ans=item;
			   }
			 })
			return ans===Number.MIN_VALUE?Number.NEGATIVE_INFINITY:ans;
		}

		function Main() {
			var n = prompt("Enter the number of elements");
			var arr = [];
			for (var i = 0; i < n; i++) {
				arr[i] = prompt("Enter element " + (i+1));
			}
			alert(secondHighest(arr));
		}
		Main();
	</script>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
